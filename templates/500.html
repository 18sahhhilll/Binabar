{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>500 | Binabar</title>
    <style>
        :root {
            --color-bg: #121212;
            --color-text: #f5f0e8;
            --color-accent: #facc15;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(4rem, 15vw, 10rem);
            font-weight: 700;
            color: var(--color-accent);
            line-height: 1;
            display: block;
        }
        .error-title {
            font-family: 'Oswald', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 600;
            margin: 1rem 0;
            text-transform: uppercase;
        }
        .error-text {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 2rem;
            max-width: 400px;
        }
        .error-link {
            display: inline-block;
            padding: 0.75rem 2rem;
            background: var(--color-accent);
            color: var(--color-bg);
            text-decoration: none;
            font-weight: 600;
            border: 3px solid var(--color-accent);
        }
        .error-link:hover { background: transparent; color: var(--color-accent); }
    </style>
</head>
<body>
    <div>
        <span class="error-code">500</span>
        <h1 class="error-title">Something broke</h1>
        <p class="error-text">The server ran into a problem. Try refreshing, or come back later.</p>
        <a href="/" class="error-link">Go home</a>
    </div>
</body>
</html>
